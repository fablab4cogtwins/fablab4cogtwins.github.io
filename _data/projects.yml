# 在 _data/projects.yml 中添加以下内容
- name: "外置式智能缺水警告装置"
  image: "/assets/images/projects/smart-water-warning.jpg"
  description: "基于电容式非接触水位检测技术的外置式预警装置"
  link: "/projects/smart-water-warning"
  detailed_description: |
    本项目针对冷风扇等带水箱家电缺水时易损坏设备、传统接触式检测存在安全风险的痛点，研发了一款外置式非接触缺水预警装置。
    采用电容式非接触水位检测技术，通过传感器感知水箱外壁介电常数变化判断水位，无需接触水体，彻底消除水电安全隐患。
    装置以STM32为控制核心，搭配OLED显示模块，可实时监测水位，缺水时自动触发预警，且无需对原有设备开孔改造，适配多种水箱材质。
    该方案满足国标低水位提醒要求，能有效保护设备、提升用户体验，可广泛应用于冷风扇、加湿器等带水箱家电场景。
  members:
    - name: "姚林邑"
      role: "项目负责人"
      responsibility: "统筹项目推进，牵头方案构思，线下调研，协调团队进度，保障项目落地"
    - name: "张俊杰"
      role: "技术骨干"
      responsibility: "参与方案设计，主导实操落地，完成核心技术开发、设备调试与系统搭建，攻克技术难点"
    - name: "王振利"
      role: "项目成员"
      responsibility: "撰写并优化项目方案，参与线下调研，协助数据采集与现场记录，支撑方案完善"
    - name: "彭涛"
      role: "项目成员"
      responsibility: "线下调研，数据采集、场景观察，及时反馈现场问题，为方案优化提供参考"
  technologies:
